<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>sandbox</title>
</head>
<body>
<!--
  This page is declared in manifest.json under "sandbox.pages". Sandboxed
  extension pages run in an opaque ("null") origin with a relaxed default
  CSP that permits 'unsafe-eval' (and 'unsafe-inline'), unlike normal
  extension pages which are locked to script-src 'self' with no eval at
  all. opencascade.js's Emscripten/embind glue code calls `new Function(...)`
  during startup (to name error classes), which needs 'unsafe-eval'. The
  main converter.html page (UI + three.js viewer, neither of which need
  eval) talks to this page via postMessage. Sandboxed pages cannot call
  chrome.* APIs, which is fine since nothing here needs them.

  sandbox.js itself is now just a thin relay: the actual OpenCASCADE/WASM
  work happens in a Worker it spawns (sandbox-worker.js), not directly in
  this document. A Worker created from this page inherits its relaxed CSP,
  so 'unsafe-eval' still works there -- confirmed against the real engine
  before shipping. Moving the heavy, fully-synchronous "sewing" call onto
  a genuine separate thread is what stops it from blocking the parent
  page too (this iframe and the parent share one main thread, being
  same-origin), which used to trigger Chrome's "page isn't responding"
  dialog on dense meshes. See sandbox.js and sandbox-worker.js for details.
-->
<script type="module" src="sandbox.js"></script>
</body>
</html>
